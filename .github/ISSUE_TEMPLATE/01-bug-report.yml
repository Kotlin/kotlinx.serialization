name: Bug report
description: Something in kotlinx.serialization behaves incorrectly
title: "[Bug] "
labels:
  - bug

body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report!

        Please focus on **what happens** and **how to reproduce it**.
        Everything else is optional.

        Before filing, a quick sanity check (no worries if you're unsure):

        - If the behavior is documented but feels wrong or questionable,
          it might be better filed as a **design discussion** rather than a bug.
        - If something is unclear rather than broken, you may get a faster answer on
          [StackOverflow](https://stackoverflow.com/) or in the [Kotlin Slack](https://slack-chats.kotlinlang.org/).
        - Please make sure the issue is in **kotlinx.serialization itself**,
          not in Kotlin, a third-party format library, or your own code.
        - If you suspect this might already be fixed, trying a recent version can help —
          but it's okay if you can't.

        If in doubt, just file the issue and describe what you see.

  - type: textarea
    id: problem
    attributes:
      label: What is happening? What should have happened instead?
      placeholder: |
        Describe what looks wrong or unexpected during serialization/deserialization.
    validations:
      required: true

  - type: textarea
    id: reproducer
    attributes:
      label: Reproducer
      description: |
        Any form of reproducer is welcome.

        - A minimal, self-contained snippet is ideal
        - A small sample project is great
        - A real-world project or production code is also fine if isolating the issue is hard

        If the code is private, please mention that — we can discuss alternatives.
      placeholder: |
        ```kotlin
        @Serializable
        data class Example(val field: String)

        fun main() {
            val json = Json.encodeToString(Example("test"))
            // unexpected behavior here
        }
        ```
    validations:
      required: true

  - type: input
    id: library-version
    attributes:
      label: kotlinx.serialization version
      placeholder: "e.g. 1.7.3"
    validations:
      required: true

  - type: input
    id: kotlin-version
    attributes:
      label: Kotlin version
      placeholder: "e.g. 2.1.0"
    validations:
      required: true

  - type: input
    id: platforms
    attributes:
      label: Kotlin platforms (optional)
      placeholder: "e.g. JVM, JS, Native"
    validations:
      required: false

  - type: input
    id: gradle-version
    attributes:
      label: Gradle version (optional)
      placeholder: "e.g. 8.10"
    validations:
      required: false

  - type: input
    id: jvm-version
    attributes:
      label: JVM version (optional)
      placeholder: "e.g. OpenJDK 21"
    validations:
      required: false

  - type: input
    id: ide-version
    attributes:
      label: IDE version (optional)
      placeholder: "e.g. IntelliJ IDEA 2024.3, Android Studio Ladybug"
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Other context (optional)
      placeholder: |
        Anything else that might be relevant: OS version, error messages, logs, format used (JSON/CBOR/ProtoBuf/etc), etc.
    validations:
      required: false
